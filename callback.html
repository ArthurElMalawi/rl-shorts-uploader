<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion TikTok</title>
<style>:root{--bg:#fff;--fg:#1d1d1f;--mut:#555;--acc:#e8711a;--box:#f3f3f5}@media (prefers-color-scheme:dark){:root{--bg:#111418;--fg:#eceff3;--mut:#a8b0bb;--acc:#ff9a45;--box:#1c2128}}
body{background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,Segoe UI,sans-serif;max-width:760px;margin:0 auto;padding:32px 16px}
code{display:block;background:var(--box);padding:12px;border-radius:8px;word-break:break-all;font-size:14px}button{margin-top:12px;padding:8px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:15px;cursor:pointer}.mut{color:var(--mut)}</style></head>
<body><h1>RL Shorts Uploader</h1><div id="r"></div>
<script>
var p=new URLSearchParams(location.search),r=document.getElementById("r");
function t(s){return document.createTextNode(s)}
if(p.get("code")){
  var h=document.createElement("p");h.appendChild(t("Autorisation TikTok reçue. Copiez cette adresse complète et collez-la dans le terminal du script :"));r.appendChild(h);
  var c=document.createElement("code");c.textContent=location.href;r.appendChild(c);
  var b=document.createElement("button");b.textContent="Copier";b.onclick=function(){navigator.clipboard.writeText(location.href);b.textContent="Copié ✓"};r.appendChild(b);
}else if(p.get("error")){
  var e=document.createElement("p");e.appendChild(t("Autorisation refusée : "+p.get("error")+" "+(p.get("error_description")||"")));r.appendChild(e);
}else{
  var m=document.createElement("p");m.className="mut";m.appendChild(t("Page de retour de connexion TikTok de RL Shorts Uploader. Rien à faire ici."));r.appendChild(m);
}
</script></body></html>
