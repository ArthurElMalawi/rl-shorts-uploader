<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion TikTok</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>@font-face{font-family:"Archivo";font-style:italic;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(fonts/archivo-latin-wdth-italic.woff2) format("woff2-variations")}@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(fonts/archivo-latin-wdth-normal.woff2) format("woff2-variations")}
:root{--bg:#0f1d36;--fg:#eaf1fc;--mut:#93a7c6;--acc:#e26e0e;--box:#13233f;--ligne:#2a4470;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.6 "Archivo",system-ui,sans-serif;max-width:760px;margin:0 auto;padding:40px 20px}
h1{font-stretch:68%;font-weight:900;font-style:italic;font-size:2.4rem;line-height:1.05;margin:0 0 24px}
code{display:block;background:var(--box);border:1px solid var(--ligne);padding:12px;word-break:break-all;font-size:14px}button{margin-top:14px;padding:10px 24px 10px 18px;border:0;background:var(--acc);color:#fff;font:inherit;font-stretch:75%;font-weight:800;font-style:italic;font-size:1.05rem;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%)}.mut{color:var(--mut)}</style></head>
<body><h1>RL Shorts Uploader</h1><div id="r"></div>
<script>
var p=new URLSearchParams(location.search),r=document.getElementById("r");
function t(s){return document.createTextNode(s)}
if(p.get("code")){
  var h=document.createElement("p");h.appendChild(t("Autorisation TikTok reçue. Copiez cette adresse complète et collez-la dans le terminal du script :"));r.appendChild(h);
  var c=document.createElement("code");c.textContent=location.href;r.appendChild(c);
  var b=document.createElement("button");b.textContent="Copier";b.onclick=function(){navigator.clipboard.writeText(location.href);b.textContent="Copié ✓"};r.appendChild(b);
}else if(p.get("error")){
  var e=document.createElement("p");e.appendChild(t("Autorisation refusée : "+p.get("error")+" "+(p.get("error_description")||"")));r.appendChild(e);
}else{
  var m=document.createElement("p");m.className="mut";m.appendChild(t("Page de retour de connexion TikTok de RL Shorts Uploader. Rien à faire ici."));r.appendChild(m);
}
</script></body></html>
